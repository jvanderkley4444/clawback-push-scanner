name: test

# Offline unit checks for scan.js pure logic — runs on every push/PR, no secrets.
# This repo had no tests at all until 2026-08-30; the sibling cwf-push-scanner's
# equivalent suite has caught real regressions, so it is worth the ~20 seconds.
on:
  push:
    paths: ['**.js']
  pull_request:
    paths: ['**.js']
  workflow_dispatch: {}

jobs:
  test:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - run: npm ci --prefer-offline --no-audit --no-fund || npm install --no-audit --no-fund
      - run: npm test
