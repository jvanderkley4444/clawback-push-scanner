name: Clawback push (requests + reminders)

# Free push delivery for paw/smack/clawback requests AND "you owe $X" reminders.
# GitHub cron is best-effort (can run a few min late; scheduled workflows auto-pause
# after 60 days of repo inactivity — any commit re-arms them). Times are UTC.
#
# COST: this repo is PUBLIC as of 2026-08-30, so GitHub-hosted standard runners are
# free and UNLIMITED and the 2,000 min/month allowance no longer applies — exactly
# the condition the old note named for going back to */15. Done. Firebase stays $0
# (Spark + FCM, no Cloud Functions).
#
# Worth knowing why the allowance mattered: GitHub bills every job rounded UP to a
# whole minute, so the old note's "well under a minute" reasoning was wrong — a
# 22-second run still cost a full minute. Together with two keep-warm crons pinging
# once every 13 minutes, the account hit its cap on 25 Aug and EVERY scheduled job
# stopped, including Cook with Friends' push, for five days.
on:
  schedule:
    - cron: '*/15 * * * *'   # every 15 minutes — public repo, unlimited minutes
  workflow_dispatch: {}      # "Run workflow" button for manual/test runs

concurrency:
  group: clawback-push
  cancel-in-progress: false

jobs:
  push:
    # Pinned, not 'ubuntu-latest': the 6 Aug outage ("The job was not acquired by
    # Runner of type hosted" + "Internal server error") hit the ubuntu-latest
    # migration pool. A pinned image is a stabler queue and identical in cost.
    runs-on: ubuntu-24.04
    timeout-minutes: 5          # a healthy run is ~20 s; past 5 min it is wedged
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'

      # Cache node_modules ITSELF, not just ~/.npm — on a hit this is a plain
      # tarball extract and npm never runs at all.
      - name: Restore node_modules
        id: modcache
        uses: actions/cache@v4
        with:
          path: node_modules
          key: nm-${{ runner.os }}-node20-${{ hashFiles('package-lock.json') }}

      - name: Install deps
        if: steps.modcache.outputs.cache-hit != 'true'
        run: npm ci --prefer-offline --no-audit --no-fund || npm install --no-audit --no-fund
      - name: Send request pushes
        env:
          # Paste the clawback-2443f service-account JSON (one line) into this repo
          # secret: Settings → Secrets and variables → Actions → New secret.
          FIREBASE_SERVICE_ACCOUNT: ${{ secrets.FIREBASE_SERVICE_ACCOUNT }}
          # "You owe $X" reminders: only fire in this UTC hour (≈ noon ET / 9am PT) so
          # nudges never arrive overnight, and at most once per person per group per N days.
          # Tap/smack/clawback request pushes are unaffected — they go out every run.
          REMIND_HOUR: '17'
          REMIND_DAYS: '3'
        run: |
          # Keep the free Render dyno warm from a job that is ALREADY running,
          # instead of a standalone keep-warm workflow. GitHub bills every job
          # rounded up to a whole minute, so an 8-second curl on its own cron
          # cost a full minute each time — ~516 min in August alone, which is
          # what exhausted the account's 2,000 free minutes and killed every
          # scheduled job on the account. Here it is free.
          # -m 5 is deliberate: Render starts the instance as soon as the request
          # reaches its router, so there is no need to wait for the response body
          # (and no risk of tipping this job over the 60-second billing boundary).
          curl -m 5 -fsS "${ORCHESTRATOR_URL:-https://clawback-ai-orchestrator.onrender.com}/healthz" -o /dev/null || true
          node scan.js
