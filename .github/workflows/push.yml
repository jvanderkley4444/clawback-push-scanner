name: Clawback request push

# Free push delivery for paw/smack/clawback requests. GitHub cron is best-effort
# (can run a few min late; scheduled workflows auto-pause after 60 days of repo
# inactivity — any commit re-arms them). Requests happen any time, so this runs
# all day, every day. Times are UTC.
on:
  schedule:
    - cron: '*/15 * * * *'   # every 15 minutes
  workflow_dispatch: {}      # "Run workflow" button for manual/test runs

concurrency:
  group: clawback-push
  cancel-in-progress: false

jobs:
  push:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: Install deps
        run: npm ci || npm install
      - name: Send request pushes
        env:
          # Paste the clawback-2443f service-account JSON (one line) into this repo
          # secret: Settings → Secrets and variables → Actions → New secret.
          FIREBASE_SERVICE_ACCOUNT: ${{ secrets.FIREBASE_SERVICE_ACCOUNT }}
          # "You owe $X" reminders: only fire in this UTC hour (≈ noon ET / 9am PT) so
          # nudges never arrive overnight, and at most once per person per group per N days.
          # Tap/smack/clawback request pushes are unaffected — they go out every run.
          REMIND_HOUR: '17'
          REMIND_DAYS: '3'
        run: node scan.js
